openapi: 3.0.3
info:
  title: Arctron Purchase API
  version: 1.0.0
  description: Valores de entrada em reais; valores persistidos e retornados em centavos.
servers:
  - url: /
paths:
  /up:
    get:
      summary: Saúde da aplicação
      responses:
        '200':
          description: Aplicação disponível
  /api/csrf:
    get:
      summary: Inicia a sessão e retorna token para requisições com alteração de estado
      responses:
        '200': {description: Token CSRF e cookie de sessão}
  /api/login:
    post:
      summary: Autentica o usuário e renova a sessão
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {description: Usuário e novo token CSRF}
        '422': {description: Credenciais inválidas}
        '429': {description: Muitas tentativas}
  /api/me:
    get:
      summary: Usuário autenticado e seu perfil
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Usuário autenticado}
        '401': {description: Autenticação necessária}
  /api/logout:
    post:
      summary: Encerra a sessão
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      responses:
        '204': {description: Sessão encerrada}
        '401': {description: Autenticação necessária}
  /api/purchases:
    get:
      summary: Consulta paginada de compras
      description: Leitores não recebem CPF, email ou observações e pesquisam clientes apenas por nome.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: reference, schema: {type: string}}
        - {in: query, name: customer, schema: {type: string}}
        - {in: query, name: date_from, schema: {type: string, format: date}}
        - {in: query, name: date_to, schema: {type: string, format: date}}
        - {in: query, name: amount_min, schema: {type: number}}
        - {in: query, name: amount_max, schema: {type: number}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
        - {in: query, name: sort_by, schema: {type: string, enum: [reference, customer, date, discount, amount], default: date}}
        - {in: query, name: sort_direction, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        '200': {description: Lista de compras paginada}
        '401': {description: Autenticação necessária}
        '422': {description: Filtros inválidos}
    post:
      summary: Processa compra; referências repetidas são ignoradas
      description: Requer perfil administrador.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInput'
      responses:
        '201': {description: Compra criada}
        '200': {description: Referência já processada}
        '401': {description: Autenticação necessária}
        '403': {description: Perfil sem permissão}
        '422': {description: Dados inválidos}
  /api/dashboard:
    get:
      summary: Indicadores e valores agregados por cliente e produto
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Resumo, clientes e produtos}
        '401': {description: Autenticação necessária}
  /api/integrations/woocommerce/webhook:
    post:
      summary: Recebe eventos order.created ou order.updated assinados pelo WooCommerce
      parameters:
        - {in: header, name: X-WC-Webhook-Topic, required: true, schema: {type: string}}
        - {in: header, name: X-WC-Webhook-Signature, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Payload de pedido do WooCommerce}
      responses:
        '201': {description: Compra criada}
        '200': {description: Evento ignorado ou compra já processada}
        '202': {description: Compra aceita para processamento assíncrono via RabbitMQ}
        '401': {description: Assinatura inválida}
        '422': {description: Pedido inválido ou CPF ausente}
        '503': {description: Segredo do webhook ou conexão de processamento não configurados}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arctron-session
  schemas:
    PurchaseInput:
      type: object
      required: [reference, amount, discount, purchased_at, customer, products]
      properties:
        reference: {type: string, example: PED-1001}
        amount: {type: string, example: '180.00'}
        discount: {type: string, example: '20.00'}
        purchased_at: {type: string, format: date-time}
        notes: {type: string, nullable: true}
        customer:
          type: object
          required: [name, email, cpf]
          properties:
            name: {type: string}
            email: {type: string, format: email}
            cpf: {type: string, example: '12345678901'}
        products:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, quantity, unit_price]
            properties:
              name: {type: string}
              quantity: {type: integer, minimum: 1}
              unit_price: {type: string, example: '100.00'}
